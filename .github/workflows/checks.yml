name: Source checks
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check source integrity
        run: bash scripts/ci/check-sources.sh
      - name: Configure custom Gradle layout
        run: ./gradlew --no-daemon -PbindingsTarget=android help
