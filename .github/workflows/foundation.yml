name: Foundation integration
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Integration target
        type: choice
        options: [all, host, android, ios]
        default: all
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false
jobs:
  host:
    if: inputs.platform == 'all' || inputs.platform == 'host'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - run: bash scripts/ci/setup-native.sh
      - id: identity
        run: bash scripts/ci/native-key.sh host
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: scripts/ffmpeg-builder/out
          key: native-host-host-${{ steps.identity.outputs.key }}
      - name: Construct host dependencies
        run: bash scripts/ffmpeg/fetch.sh host
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: scripts/ffmpeg-builder/out
          key: native-host-host-${{ steps.identity.outputs.key }}
      - name: Verify Rust and linked libraries
        run: bash scripts/test.sh host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-media-evidence
          path: |
            build/media-fixtures
            build/media-test-output
          retention-days: 7
  android:
    if: inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
      - run: bash scripts/ci/setup-native.sh
      - id: arm64
        run: bash scripts/ci/native-key.sh android arm64-v8a
      - uses: actions/cache/restore@v4
        id: arm64-cache
        with:
          path: scripts/ffmpeg-builder/out
          key: native-android-arm64-v8a-${{ steps.arm64.outputs.key }}
      - id: x64
        run: bash scripts/ci/native-key.sh android x86_64
      - uses: actions/cache/restore@v4
        id: x64-cache
        with:
          path: scripts/ffmpeg-builder/out
          key: native-android-x86_64-${{ steps.x64.outputs.key }}
      - name: Construct Android dependencies
        run: bash scripts/ffmpeg/build-android.sh arm64-v8a x86_64
      - uses: actions/cache/save@v4
        if: steps.arm64-cache.outputs.cache-hit != 'true'
        with:
          path: scripts/ffmpeg-builder/out
          key: native-android-arm64-v8a-${{ steps.arm64.outputs.key }}
      - uses: actions/cache/save@v4
        if: steps.x64-cache.outputs.cache-hit != 'true'
        with:
          path: scripts/ffmpeg-builder/out
          key: native-android-x86_64-${{ steps.x64.outputs.key }}
      - name: Release build and APK closure
        run: bash scripts/build.sh android
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 29 integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/test.sh android
      - name: API 35 integration
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/test.sh android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-foundation-evidence
          path: |
            android/build/reports
            android/build/outputs/androidTest-results
            build/android-logcat.txt
            build/android-symbols.txt
            build/android-tombstones
            build/android-screenshots
          retention-days: 7
  ios:
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - run: bash scripts/ci/setup-native.sh
      - id: identity
        run: bash scripts/ci/native-key.sh ios
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: scripts/ffmpeg-builder/out
          key: native-ios-arm64-${{ steps.identity.outputs.key }}
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: uniffi-tools-${{ runner.os }}-${{ runner.arch }}-rust1.99.1-${{ hashFiles('scripts/interop/versions.json') }}
      - name: Restore or construct identity-matching Apple dependencies
        id: native
        run: bash scripts/ffmpeg/build-ios.sh
      - name: Verify direct Swift with the actual Apple engine
        run: bash scripts/ci/verify-swift-interop.sh
      - name: Build the native SwiftUI device application
        run: bash scripts/build.sh ios-device
      - name: Verify the native SwiftUI application at runtime
        run: bash scripts/test.sh ios-simulator
      - uses: actions/cache/save@v4
        if: always() && steps.native.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: scripts/ffmpeg-builder/out
          key: native-ios-arm64-${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-foundation-evidence
          path: |
            build/swift-interop
            !build/swift-interop/iphoneos/swiftInteropSmoke
            !build/swift-interop/iphonesimulator/swiftInteropSmoke
            build/ios/**/generated
            build/ios/**/rust-build.log
            build/ios/**/native-link-flags.json
            build/ios/**/native-app.xcconfig
            build/ios/**/TARGET-IDENTITY
            build/xcode/native/**/*.log
            build/native-ios
            build/ios-screenshots
          retention-days: 7
