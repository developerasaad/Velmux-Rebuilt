[package]
name = "velmux_core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
uniffi = "=0.29.4"
thiserror = "=2.0.21"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
uuid = { version = "=1.29.3", features = ["v4", "serde"] }

[build-dependencies]
bindgen = "=0.71.1"
pkg-config = "=0.3.32"

[profile.release]
lto = "thin"
codegen-units = 1
